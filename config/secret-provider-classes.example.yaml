# Examples only. Install the Secrets Store CSI driver/provider first.
# Adjust namespace, endpoint, identity policies and secret references for your environment.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: warehouse-vault
  namespace: kafbat
spec:
  provider: vault
  parameters:
    vaultAddress: https://vault.example.com
    roleName: warehouse-worker
    objects: |
      - objectName: credentials.json
        secretPath: secret/data/warehouse
        secretKey: credentials
# The Vault KV field `credentials` holds the JSON document described in MANAGED_CONNECTIONS.md.
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: reporting-aws
  namespace: kafbat
spec:
  provider: aws
  parameters:
    region: us-east-1
    objects: |
      - objectName: arn:aws:secretsmanager:us-east-1:111111111111:secret:reporting-REPLACE
        objectType: secretsmanager
        objectAlias: credentials.json
# The AWS secret value is the JSON connection document. Grant only the profile service account access.
