name: kafkaui-delivery-lab
services:
  kafka:
    image: apache/kafka-native:3.9.1@sha256:37edf221890d67f9cfa0f540702b001ce4570157bd7875d35916f1bd670a2eee
    hostname: kafka
    cpus: 1.0
    mem_limit: 512m
    ports:
      - "127.0.0.1:${LAB_KAFKA_PORT:-19092}:9094"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:${LAB_KAFKA_PORT:-19092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 1
  postgres:
    image: postgres:16-alpine@sha256:1d5b02d3a9941fbd52437db4107f8c52d6297dac553ca1e5c299ebb3756b4857
    hostname: postgres
    cpus: 1.0
    mem_limit: 256m
    environment:
      POSTGRES_DB: kafkaui_delivery_lab
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: ${LAB_DB_PASSWORD:?generated by delivery_lab.sh}
    ports:
      - "127.0.0.1:${LAB_POSTGRES_PORT:-55432}:5432"
    volumes:
      - ${LAB_STATE_DIR:?generated by delivery_lab.sh}/certs:/certs:ro
      - postgres_data:/var/lib/postgresql/data
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        cp /certs/server.crt /tmp/server.crt
        chmod 644 /tmp/server.crt
        cp /certs/server.key /tmp/server.key
        chown postgres:postgres /tmp/server.key
        chmod 600 /tmp/server.key
        exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/tmp/server.crt -c ssl_key_file=/tmp/server.key -c fsync=on -c synchronous_commit=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d kafkaui_delivery_lab"]
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  postgres_data:
